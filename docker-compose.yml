services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - product-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - quickcart-network

  product-service:
    build: ./product-service
    ports:
      - "5001:5001"
    networks:
      - quickcart-network

  order-service:
    build: ./order-service
    ports:
      - "5002:5002"
    networks:
      - quickcart-network

  payment-service:
    build: ./payment-service
    ports:
      - "5003:5003"
    networks:
      - quickcart-network

  notification-service:
    build: ./notification-service
    ports:
      - "5004:5004"
    networks:
      - quickcart-network

networks:
  quickcart-network:
    driver: bridge
